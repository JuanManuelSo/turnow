name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_PAGE_EDITOR_ENABLED: "false"
      DATABASE_URL: postgres://turnow_app:ci-placeholder@127.0.0.1:6543/turnow_ci
      DATABASE_MIGRATION_URL: postgres://postgres:ci-placeholder@127.0.0.1:5432/turnow_ci
      BOOKING_CODE_ENCRYPTION_KEY: 1111111111111111111111111111111111111111111111111111111111111111

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check migration journal
        run: npm run db:check

      - name: Lint
        run: npm run lint

      - name: Tests (unit and disposable PostgreSQL integration)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
